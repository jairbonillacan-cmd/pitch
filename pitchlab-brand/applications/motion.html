<!doctype html><html lang="es-MX"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PitchLab · Movimiento</title><link rel="stylesheet" href="../tokens/brand-tokens.css"><style>body{display:grid;min-height:100vh;margin:0;place-items:center;background:var(--background-primary);color:var(--text-primary);font-family:var(--font-family)}main{max-width:460px;margin:20px;padding:32px;border-radius:var(--radius-panel);background:var(--surface-default)}img{width:min(260px,80%);display:block}img.run{animation:reveal var(--time-enter) var(--ease-out) both}.meter{height:4px;margin-block:20px;border-radius:10px;background:var(--border-default);overflow:hidden}.meter::before{content:"";display:block;width:36%;height:100%;background:var(--brand-primary);animation:seek var(--time-loading) ease-in-out infinite alternate}button{background:var(--brand-primary);color:var(--background-primary);border:0;border-radius:var(--radius-control);padding:12px 18px;min-height:44px;font:inherit;font-weight:650;cursor:pointer}button:focus-visible{outline:2px solid var(--brand-primary);outline-offset:3px}@keyframes reveal{from{opacity:.1;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes seek{from{transform:translateX(0)}to{transform:translateX(177%)}}@media(prefers-reduced-motion:reduce){img.run,.meter::before{animation:none}}</style><main><img class="run" src="../logos/pitchlab-horizontal-dark.svg" alt="PitchLab"><h1>Identidad en movimiento</h1><p>Entrada de 240 ms y carga indeterminada. La preferencia de movimiento reducido mantiene ambos ejemplos estáticos.</p><div class="meter" aria-hidden="true"></div><button type="button" id="repeat">Repetir entrada</button></main><script>const logo=document.querySelector("img"); document.querySelector("button").onclick=()=>{logo.classList.remove("run");void logo.offsetWidth;logo.classList.add("run")};</script></html>
