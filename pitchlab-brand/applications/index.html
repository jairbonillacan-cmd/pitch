figure data-key="dashboard" class=""><a href="../applications/dashboard.svg"><img src="../applications/dashboard.svg" alt="Dashboard / header y sidebar"></a><figcaption>Dashboard / header y sidebar</figcaption></figure><figure data-key="login" class=""><a href="../applications/login.svg"><img src="../applications/login.svg" alt="Inicio de sesión"></a><figcaption>Inicio de sesión</figcaption></figure><figure data-key="mobile" class="narrow"><a href="../applications/mobile.svg"><img src="../applications/mobile.svg" alt="Menú móvil"></a><figcaption>Menú móvil</figcaption></figure><figure data-key="splash" class="narrow"><a href="../applications/splash.svg"><img src="../applications/splash.svg" alt="Splash"></a><figcaption>Splash</figcaption></figure><figure data-key="loading" class="narrow"><a href="../applications/loading.svg"><img src="../applications/loading.svg" alt="Carga de datos"></a><figcaption>Carga de datos</figcaption></figure><figure data-key="hero" class=""><a href="../applications/hero.svg"><img src="../applications/hero.svg" alt="Landing hero"></a><figcaption>Landing hero</figcaption></figure><figure data-key="pricing" class=""><a href="../applications/pricing.svg"><img src="../applications/pricing.svg" alt="Planes y suscripción"></a><figcaption>Planes y suscripción</figcaption></figure><figure data-key="email" class=""><a href="../applications/email.svg"><img src="../applications/email.svg" alt="Email de actualización"></a><figcaption>Email de actualización</figcaption></figure><figure data-key="slide-cover" class=""><a href="../applications/slide-cover.svg"><img src="../applications/slide-cover.svg" alt="Portada de presentación"></a><figcaption>Portada de presentación</figcaption></figure><figure data-key="display-ad" class=""><a href="../applications/display-ad.svg"><img src="../applications/display-ad.svg" alt="Anuncio digital"></a><figcaption>Anuncio digital</figcaption></figure><figure data-key="app-icon-512" class=""><a href="../app-icons/app-icon
