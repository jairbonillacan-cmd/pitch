<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Invitar amigos · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
</style>
</helmet>
<div style="width: 390px; min-height: 2300px; background: #000000">
  <dc-import name="Main" theme="{{theme}}" amigos="2" hint-size="390px,2300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":2300}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
