<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Mi plan · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
</style>
</helmet>
<div style="width: 390px; min-height: 2900px; background: #000000">
  <dc-import name="Plan" theme="{{theme}}" estado="{{estado}}" hint-size="390px,2900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"estado":{"editor":"enum","options":["prueba","mensual","anual"],"default":"prueba"},"$preview":{"width":390,"height":2900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark', estado: this.props.estado ?? 'prueba' };
  }
}
</script>
</body>
</html>
