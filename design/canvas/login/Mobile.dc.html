<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Entrar a PitchLab · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
html,body{overflow-x:hidden}
.m-root{min-height:100vh;min-height:100dvh;padding:12px max(16px, calc((100% - 420px) / 2)) 16px}
@media (max-height:700px){.m-root .tight{margin-top:12px !important}}
.m{--bg:#000000;--surf2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--t1:#FFFFFF;--t2:#D4D4DC;--t3:#A1A1AD;--brand:#C4B5FD;--btn:#FFFFFF;--btnfg:#000000;--glow:rgba(196,181,253,.20);--field:rgba(255,255,255,.035)}
.m{--l1:rgba(124,92,246,.46);--l2:rgba(16,185,129,.22);--l3:rgba(56,189,248,.20);--beam:rgba(255,255,255,.045)}
.m{--sheen:rgba(255,255,255,.06);--inner:inset 0 1px 0 rgba(255,255,255,.08);--lens:rgba(18,18,24,.62);--shadow:0 30px 60px -28px rgba(0,0,0,.85);--rim-c:rgba(255,255,255,.75);--rim-t:rgba(255,255,255,.30);--rim-m:rgba(255,255,255,.04);--rim-b:rgba(255,255,255,.12)}
.m{background:var(--bg);color:var(--t1);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.m *{box-sizing:border-box}
.atmo{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 40% at 90% 0%,var(--l1),transparent 70%),radial-gradient(70% 34% at 0% 100%,var(--l2),transparent 70%),radial-gradient(50% 26% at 100% 80%,var(--l3),transparent 70%)}
.beam{position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(118deg,transparent 40%,var(--beam) 48%,transparent 56%)}
.glass{position:relative;background:linear-gradient(180deg,var(--sheen),transparent 30%),var(--lens);box-shadow:var(--inner),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;background:radial-gradient(64px circle at 0% 0%,var(--rim-c),transparent 100%),radial-gradient(64px circle at 100% 0%,var(--rim-c),transparent 100%),linear-gradient(180deg,var(--rim-t) 0%,var(--rim-m) 22%,var(--rim-m) 72%,var(--rim-b) 100%);-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask:linear-gradient(#000,#000) content-box exclude,linear-gradient(#000,#000)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;padding:0 16px;border-radius:999px;font:600 15px/1 Inter,system-ui,sans-serif;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--btn);color:var(--btnfg)}
.btn-social{background:var(--field);color:var(--t1);border-color:var(--line2)}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;color:var(--t2);margin:0 0 8px}
.inp{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line2);background:var(--field);color:var(--t1);font:500 16px Inter,system-ui,sans-serif;padding:0 16px}
.inp::placeholder{color:var(--t3)}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--glow)}
.eye{position:absolute;right:3px;top:3px;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:11px;background:transparent;color:var(--t3);cursor:pointer}
.link{color:var(--t1);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line2);padding-bottom:1px}
.small-link{color:var(--t3);font-size:13px;font-weight:500;text-decoration:none}
.quiet{background:none;border:0;padding:0 4px;min-height:44px;font:500 14px Inter,system-ui,sans-serif;color:var(--t2);cursor:pointer}
.divider{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500;color:var(--t3);margin:0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.m a:focus-visible,.m button:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
</style>
</helmet>
<div class="m m-root" style="width: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center">
  <div class="atmo" aria-hidden="true"></div>
  <div class="beam" aria-hidden="true"></div>

  <header style="position: relative; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 44px">
    <a href="#inicio" aria-label="Volver al inicio" style="position: absolute; left: 0; top: 0; width: 44px; height: 44px; display: grid; place-items: center; color: var(--t2)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <img src="/_blob/b66eec635505261b80a2a5b8cf2c161f" alt="PitchLab" style="height: 22px; width: auto">
  </header>

  <div class="tight" style="position: relative; text-align: center; margin-top: clamp(12px, 3.5vh, 28px)">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -.03em; font-weight: 700">Entra a PitchLab</h1>
    <p style="margin: 8px auto 0; max-width: 30ch; font-size: 15px; line-height: 1.5; color: var(--t2)">Lo más probable de cada partido, con su momio justo.</p>
  </div>

  <div class="glass tight" style="width: 100%; min-width: 0; margin-top: clamp(14px, 3vh, 24px); border-radius: 28px; padding: clamp(16px, 4.5vw, 20px)">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button class="btn btn-social" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"></path><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9h-4v3.1A12 12 0 0 0 12 24z"></path><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.7V6.6h-4a12 12 0 0 0 0 10.8l4-3z"></path><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"></path></svg>
        Google
      </button>
      <button class="btn btn-social" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8s2.3-1.3 3.1-2.5c1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 4.9c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"></path></svg>
        Apple
      </button>
    </div>

    <p class="divider" style="margin: clamp(12px, 2.4vh, 20px) 0">o con tu correo</p>

    <form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 14px">
      <div>
        <label class="lbl" for="m-email">Correo</label>
        <input class="inp" id="m-email" type="email" autocomplete="email" placeholder="tu@correo.com">
      </div>
      <div>
        <p class="lbl"><label for="m-pw">Contraseña</label><a class="small-link" href="#recuperar">¿La olvidaste?</a></p>
        <div style="position: relative">
          <input class="inp" id="m-pw" type="{{pwType}}" autocomplete="current-password" placeholder="Tu contraseña" style="padding-right: 56px">
          <button class="eye" type="button" aria-label="{{eyeLabel}}" onClick="{{togglePw}}">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" style="margin-top: 4px">Entrar</button>
    </form>

    <div style="display: flex; justify-content: center; margin-top: 4px; margin-bottom: -8px">
      <button class="quiet" type="button">Entrar sin contraseña</button>
    </div>
  </div>

  <p class="tight" style="position: relative; margin: clamp(12px, 2.4vh, 20px) 0 0; font-size: 14px; color: var(--t2); text-align: center">¿No tienes cuenta? <a class="link" href="#crear-cuenta">Crear cuenta</a></p>
  <p style="position: relative; margin: 4px 0 0; font-size: 12px; color: var(--t3); text-align: center">7 días gratis, sin tarjeta</p>

  <div style="position: relative; margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <button class="quiet" type="button" style="font-size: 13px; color: var(--t3)">¿Eres socio? Entra con tu PIN</button>
    <p style="margin: 0; font-size: 11px; color: var(--t3)">Solo mayores de 18. PitchLab no acepta apuestas.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPw: false };
  }
  renderVals() {
    const showPw = this.state.showPw;
    return {
      pwType: showPw ? 'text' : 'password',
      eyeLabel: showPw ? 'Ocultar contraseña' : 'Mostrar contraseña',
      togglePw: () => this.setState({ showPw: !showPw }),
      submit: (e) => { e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
