name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Escaneo de secretos en arbol Git
        run: node scripts/check-no-secrets.mjs

      - name: Auditoria de dependencias de produccion (criticas)
        run: pnpm audit --prod --audit-level=critical

      - name: Build (gate anti-demo + typecheck + linter)
        run: pnpm build

      - name: Pruebas unitarias
        run: pnpm test

      - name: Instalar Chromium (E2E)
        run: pnpm --filter @pitchlab/web exec playwright install --with-deps chromium

      - name: E2E (Playwright, desktop y movil)
        run: pnpm --filter @pitchlab/web e2e
