name: Pre-MVP Snapshot Pipeline

on:
  schedule:
    # Diario a las 05:00 CDMX (11:00 UTC)
    - cron: "0 11 * * *"
    # Cada 3 horas en días de jornada (jueves a lunes)
    - cron: "0 */3 * * 0,1,4,5,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Generar snapshots y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar snapshots reales
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: pnpm snapshot

      # SEC-10: En corridas automáticas solo se sincronizan artefactos JSON validados
      # (`--data-only`), nunca código ejecutable `.ts` sin revisión humana en PR.
      - name: Sincronizar matriz JSON de Spacetime v3.0 desde prediction-lab
        continue-on-error: true
        run: |
          git fetch --depth=1 origin prediction-lab:refs/remotes/origin/prediction-lab
          node packages/spacetime/scripts/sync-from-prediction-lab.mjs --data-only
          if ! pnpm --filter @pitchlab/spacetime test; then
            echo "Las pruebas de Spacetime fallaron con los datos nuevos; se descartan."
            git checkout -- packages/spacetime/data
            git clean -fd packages/spacetime/data
          fi

      # FD-20: volumen por resultado en mercados de predicción (API pública, sin clave).
      - name: Volumen por resultado (mercados de predicción)
        continue-on-error: true
        run: pnpm --filter @pitchlab/ingest exec tsx src/market-pulse-cli.ts

      - name: Guardar cambios en data/snapshots
        run: |
          git config user.name "pitchlab-bot"
          git config user.email "bot@pitchlab.app"
          git add data/snapshots packages/spacetime/data
          if git diff --staged --quiet; then
            echo "Sin cambios en snapshots."
          else
            git commit -m "datos(snapshots): actualizar corte automático pre-MVP"
            git push
          fi

      # SEC-10: Se pasa la URL por stdin (`--config -`) y sin `-S` para jamás imprimir el secreto en logs.
      - name: Disparar deploy hook de Vercel (opcional)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            printf 'url = "%s"\n' "$VERCEL_DEPLOY_HOOK_URL" | curl -fsL -X POST --config - >/dev/null
            echo "Deploy hook disparado."
          else
            echo "Sin deploy hook configurado; se omite."
          fi
